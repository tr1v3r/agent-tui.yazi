name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Check Lua syntax
        run: luac -p main.lua
      - name: Check packaged helper syntax
        run: node --check assets/inject.mjs
      - name: Test injection helper
        run: node --test
      - name: Test plugin target routing
        run: lua test/main.test.lua
